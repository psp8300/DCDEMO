<div class="login-container">
  <mat-card class="login-card">
    <div class="login-header">
      <div class="logo">DC</div>
      <h1>DClutter</h1>
      <p>Sign in to your account</p>
    </div>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email or Username</mat-label>
        <input matInput [(ngModel)]="email" type="email" placeholder="Enter your email" (keyup.enter)="onLogin()" />
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [(ngModel)]="password" [type]="hidePassword ? 'password' : 'text'" placeholder="Enter your password" (keyup.enter)="onLogin()" />
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <div class="error-message" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button mat-raised-button color="primary" class="login-btn" (click)="onLogin()" [disabled]="loading">
        <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
        <span *ngIf="!loading">Sign In</span>
      </button>

      <div class="demo-hint">
        <div class="demo-hint-label">Demo accounts — click to fill</div>
        <div class="demo-chips">
          <button *ngFor="let acc of demoAccounts" class="demo-chip"
                  [class.manager-chip]="acc.label === 'Manager'"
                  (click)="quickFill(acc.email, acc.password)" type="button">
            <mat-icon>{{ acc.icon }}</mat-icon>
            <span class="chip-label">{{ acc.label }}</span>
            <span class="chip-cred">{{ acc.email }}</span>
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
