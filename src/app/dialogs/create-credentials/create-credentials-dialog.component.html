<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="dialog-title">
      <mat-icon style="color:#c62828">lock</mat-icon>
      <span>New Credentials</span>
    </div>
    <button mat-icon-button (click)="cancel()"><mat-icon>close</mat-icon></button>
  </div>

  <div class="dialog-body">
    <!-- Variant selector -->
    <div class="variant-row">
      <button *ngFor="let v of variants"
        class="var-chip"
        [class.active]="selected.id === v.id"
        [style.--vc]="v.color"
        (click)="selected = v">
        <mat-icon>{{ v.icon }}</mat-icon> {{ v.name }}
      </button>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name / Site *</mat-label>
      <input matInput [(ngModel)]="name" placeholder="e.g. Gmail, HDFC Bank…" />
      <mat-icon matPrefix>label</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" *ngIf="selected.id === 24">
      <mat-label>Website URL</mat-label>
      <input matInput [(ngModel)]="website" placeholder="https://…" />
      <mat-icon matPrefix>public</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Username / Account Number</mat-label>
      <input matInput [(ngModel)]="username" />
      <mat-icon matPrefix>person</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="email" type="email" />
      <mat-icon matPrefix>email</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input matInput [(ngModel)]="password" [type]="showPwd ? 'text' : 'password'" />
      <mat-icon matPrefix>key</mat-icon>
      <button mat-icon-button matSuffix type="button" (click)="showPwd=!showPwd">
        <mat-icon>{{ showPwd ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <div class="row-2">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>PIN</mat-label>
        <input matInput [(ngModel)]="pin" [type]="showPwd ? 'text' : 'password'" maxlength="10" />
        <mat-icon matPrefix>pin</mat-icon>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mobile</mat-label>
        <input matInput [(ngModel)]="mobile" />
        <mat-icon matPrefix>phone</mat-icon>
      </mat-form-field>
    </div>

    <div class="security-note">
      <mat-icon>info_outline</mat-icon>
      <span>Stored locally only. Passwords are not encrypted.</span>
    </div>
  </div>

  <div class="dialog-actions">
    <button mat-stroked-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" [disabled]="!canSave || saving" (click)="save()">
      <mat-spinner *ngIf="saving" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
      <mat-icon *ngIf="!saving">save</mat-icon>
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>
</div>
