<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="dialog-title">
      <mat-icon style="color:#f57c00">sticky_note_2</mat-icon>
      <span>New Note</span>
    </div>
    <button mat-icon-button (click)="cancel()"><mat-icon>close</mat-icon></button>
  </div>

  <div class="dialog-body">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title <span class="optional">(optional)</span></mat-label>
      <input matInput [(ngModel)]="title" placeholder="Note title…" />
      <mat-icon matPrefix>title</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Note Content *</mat-label>
      <textarea matInput [(ngModel)]="content" rows="8"
        placeholder="Write your note here…"></textarea>
    </mat-form-field>
  </div>

  <div class="dialog-actions">
    <button mat-stroked-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary"
      [disabled]="!canSave || saving"
      (click)="save()">
      <mat-spinner *ngIf="saving" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
      <mat-icon *ngIf="!saving">save</mat-icon>
      {{ saving ? 'Saving…' : 'Save Note' }}
    </button>
  </div>
</div>
