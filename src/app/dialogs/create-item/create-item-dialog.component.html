<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="dialog-title">
      <mat-icon>add_circle</mat-icon>
      <span>Create New Item</span>
    </div>
    <button mat-icon-button (click)="cancel()"><mat-icon>close</mat-icon></button>
  </div>

  <p class="dialog-hint">What would you like to add?</p>

  <div class="type-grid">
    <button *ngFor="let card of typeCards"
      class="type-card"
      [style.--card-color]="card.color"
      [matTooltip]="card.description"
      matTooltipPosition="above"
      (click)="openType(card)">
      <mat-icon class="type-icon">{{ card.icon }}</mat-icon>
      <span class="type-name">{{ card.name }}</span>
    </button>
  </div>

  <div class="dialog-footer">
    <button mat-stroked-button (click)="cancel()">Cancel</button>
  </div>
</div>
