<div class="dialog-wrapper">
  <div class="dialog-header">
    <div class="dialog-title"><mat-icon style="color:#37474f">business</mat-icon><span>New Entity</span></div>
    <button mat-icon-button (click)="cancel()"><mat-icon>close</mat-icon></button>
  </div>
  <div class="dialog-body">
    <div class="variant-row">
      <button *ngFor="let v of variants" class="var-chip" [class.active]="selected.id===v.id"
        [style.--vc]="v.color" (click)="selected=v">
        <mat-icon>{{ v.icon }}</mat-icon> {{ v.name }}
      </button>
    </div>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name *</mat-label>
      <input matInput [(ngModel)]="name" placeholder="e.g. HDFC Bank, Zomato, GHMC…" />
      <mat-icon matPrefix>business</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Website URL</mat-label>
      <input matInput [(ngModel)]="website" placeholder="https://…" />
      <mat-icon matPrefix>public</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Availability / Hours</mat-label>
      <input matInput [(ngModel)]="hours" placeholder="e.g. Mon–Fri 9am–6pm" />
      <mat-icon matPrefix>schedule</mat-icon>
    </mat-form-field>
  </div>
  <div class="dialog-actions">
    <button mat-stroked-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" [disabled]="!canSave||saving" (click)="save()">
      <mat-spinner *ngIf="saving" diameter="18" style="display:inline-block;margin-right:6px"></mat-spinner>
      <mat-icon *ngIf="!saving">save</mat-icon> {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>
</div>
